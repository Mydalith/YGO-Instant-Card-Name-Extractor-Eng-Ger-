<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YGO Instant Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --primary: #FFB703;
            --bg-dark: #0f111a;
            --bg-panel: #1a1d29;
            --neon-cyan: #00f3ff;
            --text-light: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header { background: var(--bg-panel); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 1px solid #2d3748; }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #FFB703, #FF8C00); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #000; font-size: 16px; }
        .title-group h1 { font-size: 15px; font-weight: 700; color: var(--primary); }
        .title-group p { font-size: 10px; color: #a0aec0; }
        
        .status-pill { display: flex; align-items: center; gap: 6px; background: #064e3b; color: #34d399; padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid #047857; }
        .dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; animation: pulse 2s infinite; }

        /* SCANNER AREA (TUNNEL VISION) */
        .scanner-container { position: relative; flex: 1.1; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #000; }
        #camera-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        /* Streng verengter Kasten: Spart Symbol rechts & Ränder unten/oben komplett aus */
        .tunnel-mask {
            position: absolute;
            top: 50%;
            left: 46%; /* Leicht nach links versetzt, um den Text zentriert zu halten und das Symbol rechts auszusperren */
            transform: translate(-50%, -50%);
            width: 58%; 
            height: 32px; /* Flacher: Verhindert Erfassen von Kartentyp darunter */
            max-width: 230px;
            box-shadow: 0 0 0 9999px rgba(5, 5, 8, 0.98);
            border: 2px solid var(--neon-cyan);
            border-radius: 4px;
            z-index: 2;
        }

        .tunnel-label { 
            position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
            white-space: nowrap; text-align: center; color: #fff; font-size: 10px; 
            font-weight: bold; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; 
        }
        
        .laser-line { width: 100%; height: 2px; background: var(--primary); position: absolute; top: 50%; box-shadow: 0 0 8px var(--primary); animation: scan 2s ease-in-out infinite; opacity: 0.8; }

        .tools-overlay { position: absolute; bottom: 8px; right: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 10; }
        .tool-btn { background: rgba(20, 24, 35, 0.85); border: 1px solid rgba(255,255,255,0.25); color: white; border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 600; cursor: pointer; }
        #torch-btn { width: 34px; height: 34px; border-radius: 50%; font-size: 14px; display: none; }
        .preview-canvas-container { border: 1px solid #444; border-radius: 4px; overflow: hidden; background: #000; }
        #debug-canvas { max-width: 80px; height: auto; display: block; }

        /* CONTROLS */
        .controls-panel { padding: 10px 14px; background: var(--bg-dark); z-index: 10; display: flex; flex-direction: column; gap: 8px; }
        .main-action-row { display: flex; gap: 10px; }
        
        #scan-btn {
            flex: 1;
            background: linear-gradient(180deg, #FFC933 0%, #FFB703 100%);
            color: #000; border: none; border-radius: 10px;
            padding: 14px; font-size: 16px; font-weight: 800;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(255, 183, 3, 0.3);
        }
        #scan-btn:active { transform: scale(0.97); }
        
        .counter-box { background: var(--bg-panel); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 70px; border: 1px solid #2d3748; }
        .counter-box span { font-size: 9px; color: #a0aec0; text-transform: uppercase; font-weight: bold; }
        .counter-box strong { font-size: 18px; color: var(--primary); }

        /* LIST AREA */
        .list-container { flex: 1; background: var(--bg-panel); margin: 0 14px; border-radius: 10px 10px 0 0; border: 1px solid #2d3748; border-bottom: none; display: flex; flex-direction: column; overflow: hidden; }
        .list-header { padding: 8px 12px; background: rgba(0,0,0,0.2); border-bottom: 1px solid #2d3748; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .clear-btn { color: #f87171; background: none; border: none; font-size: 11px; cursor: pointer; }
        
        #card-list-ui { flex: 1; overflow-y: auto; padding: 8px; list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .card-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
        .card-left { display: flex; align-items: center; gap: 8px; overflow: hidden; }
        .card-name-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-qty { background: rgba(255,183,3,0.2); color: var(--primary); padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; flex-shrink: 0; }
        .delete-item-btn { color: #718096; background: none; border: none; font-size: 14px; padding: 0 4px; cursor: pointer; }

        /* EXPORT ROW */
        .export-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px 14px 12px 14px; background: var(--bg-panel); border-top: 1px solid #2d3748; }
        .export-btn { background: #2d3748; color: #fff; border: none; padding: 9px; border-radius: 6px; font-size: 12px; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 4px; cursor: pointer; }
        .export-btn.gemini { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .export-btn.ydk { background: #059669; }

        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; flex-direction: column; color: white; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid var(--primary); border-radius: 50%; width: 34px; height: 34px; animation: spin 1s linear infinite; margin-bottom: 8px; }

        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        @keyframes pulse { 0% { transform: scale(0.95); } 70% { transform: scale(1); } 100% { transform: scale(0.95); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">📷</div>
            <div class="title-group">
                <h1>YGO INSTANT SCANNER</h1>
                <p>Zero-Popup Deckliste</p>
            </div>
        </div>
        <div class="status-pill" id="ocr-status">
            <div class="dot"></div> Lädt OCR...
        </div>
    </header>

    <div class="scanner-container">
        <video id="camera-feed" autoplay playsinline muted></video>
        <div class="tunnel-mask" id="tunnel-hole">
            <div class="tunnel-label">NUR Kartentitel hier einpassen</div>
            <div class="laser-line"></div>
        </div>
        
        <div class="tools-overlay">
            <button class="tool-btn" id="torch-btn" onclick="toggleTorch()">🔦</button>
            <div class="preview-canvas-container">
                <canvas id="debug-canvas"></canvas>
            </div>
        </div>
    </div>

    <div class="list-container">
        <div class="list-header">
            <span>📋 Live-Liste (ohne Bestätigung)</span>
            <button class="clear-btn" onclick="clearList()">Liste leeren</button>
        </div>
        <ul id="card-list-ui"></ul>
    </div>

    <div class="controls-panel">
        <div class="main-action-row">
            <button id="scan-btn" onclick="captureAndScan()" disabled>
                ◉ ABDRUCK SCANNEN
            </button>
            <div class="counter-box">
                <span>Karten</span>
                <strong id="card-counter">0</strong>
            </div>
        </div>
        
        <div class="export-row">
            <button class="export-btn gemini" onclick="exportGemini()">✨ Gemini Prompt</button>
            <button class="export-btn ydk" onclick="exportYDK()">🔻 YGOPro .YDK</button>
            <button class="export-btn" onclick="exportNeuron()">📄 Neuron List</button>
            <button class="export-btn" onclick="exportTXT()">💾 .TXT</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Gleiche Datenbank ab...</div>
    </div>

    <script>
        let video = document.getElementById('camera-feed');
        let tunnelHole = document.getElementById('tunnel-hole');
        let debugCanvas = document.getElementById('debug-canvas');
        let torchBtn = document.getElementById('torch-btn');
        
        let worker = null;
        let cardList = [];
        let videoTrack = null;
        let torchEnabled = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(850, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1250, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
            if (navigator.vibrate) navigator.vibrate(40);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', focusMode: 'continuous', width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                const cap = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if (cap.torch) torchBtn.style.display = 'flex';
            } catch (err) {
                alert("Kamera-Zugriff nicht möglich: " + err.message);
            }
        }

        function toggleTorch() {
            if (!videoTrack) return;
            torchEnabled = !torchEnabled;
            videoTrack.applyConstraints({ advanced: [{ torch: torchEnabled }] });
            torchBtn.style.background = torchEnabled ? 'rgba(255, 183, 3, 0.4)' : 'rgba(20, 24, 35, 0.85)';
        }

        async function initOCR() {
            try {
                worker = await Tesseract.createWorker(['deu', 'eng']);
                await worker.setParameters({
                    tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE,
                    tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß0123456789 -,'"
                });
                document.getElementById('ocr-status').innerHTML = '<div class="dot" style="background:#34d399;animation:none;"></div> OCR Bereit';
                document.getElementById('scan-btn').disabled = false;
            } catch (e) {
                document.getElementById('ocr-status').innerHTML = '<div class="dot" style="background:#ef4444;"></div> OCR Fehler';
            }
        }

        startCamera();
        initOCR();

        async function captureAndScan() {
            if (!worker) return;
            playBeep();
            
            const vRatio = video.videoWidth / video.videoHeight;
            const wRatio = window.innerWidth / video.clientHeight;
            
            let dW = video.videoWidth, dH = video.videoHeight, sX = 0, sY = 0;
            if (wRatio < vRatio) {
                dW = video.videoHeight * wRatio;
                sX = (video.videoWidth - dW) / 2;
            } else {
                dH = video.videoWidth / wRatio;
                sY = (video.videoHeight - dH) / 2;
            }

            const holeRect = tunnelHole.getBoundingClientRect();
            const scX = dW / window.innerWidth;
            const scY = dH / video.clientHeight;

            const cropX = sX + (holeRect.left * scX);
            const cropY = sY + (holeRect.top * scY);
            const cropW = holeRect.width * scX;
            const cropH = holeRect.height * scY;

            // 3.5x Supersampling
            const scale = 3.5;
            debugCanvas.width = Math.round(cropW * scale);
            debugCanvas.height = Math.round(cropH * scale);
            const ctx = debugCanvas.getContext('2d', { willReadFrequently: true });
            
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, debugCanvas.width, debugCanvas.height);
            
            // Adaptiver Schärfe- und Kontrastfilter (erkennt auch weiße Schrift auf Fallen/Zauberkarten)
            const imgData = ctx.getImageData(0, 0, debugCanvas.width, debugCanvas.height);
            const d = imgData.data;
            
            let totalLum = 0;
            for (let i = 0; i < d.length; i += 4) {
                totalLum += (d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114);
            }
            const avgLum = totalLum / (d.length / 4);

            for (let i = 0; i < d.length; i += 4) {
                let lum = (d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114);
                // Dynamischer Kontrast
                lum = lum < avgLum ? lum * 0.6 : Math.min(255, lum * 1.35);
                d[i] = d[i+1] = d[i+2] = lum;
            }
            ctx.putImageData(imgData, 0, 0);

            const result = await worker.recognize(debugCanvas);
            let clean = cleanExtractedName(result.data.text);

            if (clean.length >= 3) {
                cardList.push(clean);
                updateUI();
            }
        }

        // Strenger Filter gegen Icon-Glitches am Ende des Namens
        function cleanExtractedName(raw) {
            return raw
                .replace(/[^a-zA-ZÄÖÜäöüß0-9\s\-,']/g, '') // Ungültige Zeichen weg
                .replace(/\s+(a|x|bf|ii|57|e|i|h|o|u|m)$/i, '') // Schneidet typische Eigenschafts-Icon-Artefakte am Ende ab
                .replace(/^[\s\-,']+|[\s\-,']+$/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }

        function updateUI() {
            document.getElementById('card-counter').innerText = cardList.length;
            const uiList = document.getElementById('card-list-ui');
            const counts = {};
            cardList.forEach(c => counts[c] = (counts[c] || 0) + 1);
            
            uiList.innerHTML = '';
            for (const [name, qty] of Object.entries(counts)) {
                uiList.innerHTML += `
                    <li class="card-item">
                        <div class="card-left">
                            <span class="card-qty">${qty}x</span>
                            <span class="card-name-txt">${name}</span>
                        </div>
                        <button class="delete-item-btn" onclick="removeSingleCard('${name.replace(/'/g, "\\'")}')">✕</button>
                    </li>`;
            }
            uiList.scrollTop = uiList.scrollHeight;
        }

        function removeSingleCard(cardName) {
            const idx = cardList.lastIndexOf(cardName);
            if (idx !== -1) {
                cardList.splice(idx, 1);
                updateUI();
            }
        }

        function clearList() {
            if(confirm('Liste wirklich leeren?')) {
                cardList = [];
                updateUI();
            }
        }

        function showLoading(text) {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-overlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function getAggregatedList() {
            const counts = {};
            cardList.forEach(c => counts[c] = (counts[c] || 0) + 1);
            return Object.entries(counts).map(([name, qty]) => `${qty}x ${name}`).join('\n');
        }

        function exportGemini() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            const prompt = "Bitte analysiere diese Yu-Gi-Oh! Deckliste und gib mir Empfehlungen für Synergien und passende Ergänzungen:\n\n" + getAggregatedList();
            navigator.clipboard.writeText(prompt).then(() => alert("Gemini Prompt in Zwischenablage kopiert!"));
        }

        function exportTXT() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            const blob = new Blob([getAggregatedList()], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'YGO_Deckliste.txt';
            a.click();
        }

        function exportNeuron() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            let out = "#created by YGO Instant Scanner\n#main\n";
            cardList.forEach(c => out += c + "\n");
            out += "#extra\n!side\n";
            const blob = new Blob([out], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Neuron_Deck.txt';
            a.click();
        }

        async function exportYDK() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            showLoading("Gleiche mit YGOPRODeck API ab...");
            
            const counts = {};
            cardList.forEach(c => counts[c] = (counts[c] || 0) + 1);
            
            let mainDeckIds = [];
            let extraDeckIds = [];
            let notFound = [];

            for (const [name, qty] of Object.entries(counts)) {
                try {
                    let res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?name=${encodeURIComponent(name)}`);
                    if (!res.ok) {
                        res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?language=de&name=${encodeURIComponent(name)}`);
                    }
                    
                    if (res.ok) {
                        const data = await res.json();
                        const card = data.data[0];
                        const type = card.type.toLowerCase();
                        const id = card.id;
                        
                        const isExtra = type.includes('fusion') || type.includes('synchro') || type.includes('xyz') || type.includes('link');
                        for(let i=0; i<qty; i++) {
                            if(isExtra) extraDeckIds.push(id);
                            else mainDeckIds.push(id);
                        }
                    } else {
                        notFound.push(name);
                    }
                } catch(e) {
                    notFound.push(name);
                }
            }

            hideLoading();
            if (notFound.length > 0) {
                alert("Nicht in YGOPRODeck gefunden:\n" + notFound.join(", "));
            }

            let ydk = "#created by YGO Instant Scanner\n#main\n";
            mainDeckIds.forEach(id => ydk += id + "\n");
            ydk += "#extra\n";
            extraDeckIds.forEach(id => ydk += id + "\n");
            ydk += "!side\n";

            const blob = new Blob([ydk], { type: 'text/ydk' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Deck.ydk';
            a.click();
        }
    </script>
</body>
</html>
