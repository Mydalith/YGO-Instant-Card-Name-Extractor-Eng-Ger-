<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YGO Instant Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --primary: #FFB703;
            --bg-dark: #0f111a;
            --bg-panel: #1a1d29;
            --neon-cyan: #00f3ff;
            --text-light: #e2e8f0;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }

        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        /* HEADER */
        header { 
            background: var(--bg-panel); 
            padding: 12px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10; 
            border-bottom: 1px solid #2d3748; 
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { 
            width: 36px; height: 36px; 
            background: linear-gradient(135deg, #FFB703, #FF8C00); 
            border-radius: 8px; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: bold; color: #000; 
        }
        .title-group h1 { font-size: 16px; font-weight: 700; color: var(--primary); }
        .title-group p { font-size: 11px; color: #a0aec0; }
        
        .status-pill { 
            display: flex; align-items: center; gap: 6px; 
            background: #064e3b; color: #34d399; 
            padding: 4px 10px; border-radius: 20px; 
            font-size: 12px; font-weight: 600; 
            border: 1px solid #047857; 
        }
        .dot { 
            width: 8px; height: 8px; 
            background: #34d399; border-radius: 50%; 
            animation: pulse 2s infinite; 
        }

        /* SCANNER AREA (TUNNEL VISION) */
        .scanner-container { 
            position: relative; flex: 1; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; background: #000; 
        }
        #camera-feed { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
        }
        
        /* The Pitch Black Mask */
        .tunnel-mask {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%; 
            height: 64px; 
            max-width: 300px;
            box-shadow: 0 0 0 9999px rgba(5, 5, 8, 0.98);
            border: 2px solid var(--neon-cyan);
            border-radius: 4px;
            z-index: 2;
        }

        .tunnel-label { 
            position: absolute; top: -30px; left: 0; width: 100%; 
            text-align: center; color: #fff; font-size: 12px; 
            font-weight: bold; background: rgba(0,0,0,0.6); 
            padding: 4px; border-radius: 4px; 
        }
        
        .laser-line { 
            width: 100%; height: 2px; background: var(--primary); 
            position: absolute; top: 50%; 
            box-shadow: 0 0 10px var(--primary); 
            animation: scan 2.5s ease-in-out infinite; opacity: 0.7; 
        }

        /* TOOLS OVERLAY (Flashlight & Preview) */
        .tools-overlay {
            position: absolute; bottom: 16px; right: 16px;
            display: flex; flex-direction: column; gap: 10px; z-index: 10;
        }
        #torch-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; border-radius: 50%; width: 44px; height: 44px;
            display: none; justify-content: center; align-items: center; font-size: 20px;
            backdrop-filter: blur(4px);
        }
        .preview-canvas-container { 
            border: 1px solid #444; border-radius: 4px; 
            overflow: hidden; background: #000; 
        }
        #debug-canvas { max-width: 100px; height: auto; display: block; }

        /* CONTROLS */
        .controls-panel { 
            padding: 16px; background: var(--bg-dark); 
            z-index: 10; display: flex; flex-direction: column; gap: 12px; 
        }
        .main-action-row { display: flex; gap: 12px; }
        
        #scan-btn {
            flex: 1;
            background: linear-gradient(180deg, #FFC933 0%, #FFB703 100%);
            color: #000; border: none; border-radius: 12px;
            padding: 16px; font-size: 18px; font-weight: 800;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3);
            transition: transform 0.1s;
        }
        #scan-btn:active { transform: scale(0.96); }
        
        .counter-box { 
            background: var(--bg-panel); border-radius: 12px; padding: 10px 16px; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; min-width: 80px; border: 1px solid #2d3748; 
        }
        .counter-box span { font-size: 10px; color: #a0aec0; text-transform: uppercase; font-weight: bold; }
        .counter-box strong { font-size: 20px; color: var(--primary); }

        /* LIST AREA */
        .list-container { 
            flex: 1; background: var(--bg-panel); margin: 0 16px; 
            border-radius: 12px 12px 0 0; border: 1px solid #2d3748; 
            border-bottom: none; display: flex; flex-direction: column; overflow: hidden; 
        }
        .list-header { 
            padding: 12px 16px; background: rgba(0,0,0,0.2); 
            border-bottom: 1px solid #2d3748; display: flex; 
            justify-content: space-between; align-items: center; font-size: 13px; 
        }
        .clear-btn { color: #f87171; background: none; border: none; font-size: 12px; padding: 4px; }
        
        #card-list-ui { 
            flex: 1; overflow-y: auto; padding: 10px; 
            list-style: none; display: flex; flex-direction: column; gap: 8px; 
        }
        .card-item { 
            display: flex; align-items: center; gap: 10px; 
            background: rgba(255,255,255,0.05); padding: 10px 12px; 
            border-radius: 8px; font-size: 14px; 
        }
        .card-qty { 
            background: rgba(255,183,3,0.2); color: var(--primary); 
            padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 12px; 
        }

        /* EXPORT ROW */
        .export-row { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; 
            padding: 12px 16px; background: var(--bg-panel); border-top: 1px solid #2d3748; 
        }
        .export-btn { 
            background: #2d3748; color: #fff; border: none; 
            padding: 12px; border-radius: 8px; font-size: 13px; 
            font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 6px; 
        }
        .export-btn.gemini { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        
        /* Modal for Loading */
        #loading-overlay { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.8); 
            z-index: 999; justify-content: center; align-items: center; 
            flex-direction: column; color: white; 
        }
        .spinner { 
            border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid var(--primary); 
            border-radius: 50%; width: 40px; height: 40px; 
            animation: spin 1s linear infinite; margin-bottom: 10px; 
        }

        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        @keyframes pulse { 
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); } 
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); } 
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">📷</div>
            <div class="title-group">
                <h1>YGO INSTANT SCANNER</h1>
                <p>Zero-Popup Deckliste</p>
            </div>
        </div>
        <div class="status-pill" id="ocr-status">
            <div class="dot"></div> Lädt OCR...
        </div>
    </header>

    <div class="scanner-container">
        <video id="camera-feed" autoplay playsinline muted></video>
        <div class="tunnel-mask" id="tunnel-hole">
            <div class="tunnel-label">Kartenname hier (Abstand halten)</div>
            <div class="laser-line"></div>
        </div>
        
        <div class="tools-overlay">
            <button id="torch-btn" onclick="toggleTorch()">🔦</button>
            <div class="preview-canvas-container">
                <canvas id="debug-canvas"></canvas>
            </div>
        </div>
    </div>

    <div class="list-container">
        <div class="list-header">
            <span>📋 Live-Liste (ohne Bestätigung)</span>
            <button class="clear-btn" onclick="clearList()">Liste leeren</button>
        </div>
        <ul id="card-list-ui"></ul>
    </div>

    <div class="controls-panel">
        <div class="main-action-row">
            <button id="scan-btn" onclick="captureAndScan()" disabled>
                ◉ ABDRUCK SCANNEN
            </button>
            <div class="counter-box">
                <span>Karten</span>
                <strong id="card-counter">0</strong>
            </div>
        </div>
        
        <div class="export-row">
            <button class="export-btn gemini" onclick="exportGemini()">✨ Gemini Prompt</button>
            <button class="export-btn" onclick="exportYDK()">🔻 YGOPro .YDK</button>
            <button class="export-btn" onclick="exportNeuron()">📄 Neuron List</button>
            <button class="export-btn" onclick="exportTXT()">💾 .TXT</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Gleiche Datenbank ab...</div>
    </div>

    <script>
        let video = document.getElementById('camera-feed');
        let tunnelHole = document.getElementById('tunnel-hole');
        let debugCanvas = document.getElementById('debug-canvas');
        let torchBtn = document.getElementById('torch-btn');
        
        let worker = null;
        let cardList = [];
        let videoTrack = null;
        let torchEnabled = false;

        // Audio Context for feedback
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // Initialize Camera & Flashlight Support
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', focusMode: 'continuous', width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                
                // Check if Flashlight is supported
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.torch) {
                    torchBtn.style.display = 'flex';
                }
            } catch (err) {
                alert("Kamera-Fehler: " + err.message);
            }
        }

        function toggleTorch() {
            if (!videoTrack) return;
            torchEnabled = !torchEnabled;
            videoTrack.applyConstraints({
                advanced: [{ torch: torchEnabled }]
            });
            torchBtn.style.background = torchEnabled ? 'rgba(255, 183, 3, 0.4)' : 'rgba(255, 255, 255, 0.1)';
        }

        // Initialize Tesseract with explicit Umlaut support
        async function initOCR() {
            try {
                worker = await Tesseract.createWorker(['deu', 'eng']);
                await worker.setParameters({
                    tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE,
                    tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß0123456789 -,'&!"
                });
                document.getElementById('ocr-status').innerHTML = '<div class="dot" style="background:#34d399;animation:none;"></div> OCR Bereit';
                document.getElementById('scan-btn').disabled = false;
            } catch (e) {
                document.getElementById('ocr-status').innerHTML = '<div class="dot" style="background:#ef4444;"></div> OCR Fehler';
            }
        }

        startCamera();
        initOCR();

        // CAPTURE & PROCESS LOGIC (With 2-Pass Fallback)
        async function captureAndScan() {
            if (!worker) return;
            playBeep();
            
            // Calculate exact crop box
            const videoRatio = video.videoWidth / video.videoHeight;
            const windowRatio = window.innerWidth / video.clientHeight;
            
            let drawW = video.videoWidth;
            let drawH = video.videoHeight;
            let startX = 0; let startY = 0;

            if (windowRatio < videoRatio) {
                drawW = video.videoHeight * windowRatio;
                startX = (video.videoWidth - drawW) / 2;
            } else {
                drawH = video.videoWidth / windowRatio;
                startY = (video.videoHeight - drawH) / 2;
            }

            const holeRect = tunnelHole.getBoundingClientRect();
            const scaleX = drawW / window.innerWidth;
            const scaleY = drawH / video.clientHeight;

            const cropX = startX + (holeRect.left * scaleX);
            const cropY = startY + (holeRect.top * scaleY);
            const cropW = holeRect.width * scaleX;
            const cropH = holeRect.height * scaleY;

            const scaleFactor = 3;
            debugCanvas.width = cropW * scaleFactor;
            debugCanvas.height = cropH * scaleFactor;
            const ctx = debugCanvas.getContext('2d', { willReadFrequently: true });
            
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, debugCanvas.width, debugCanvas.height);
            
            // PASS 1: Soft contrast for standard / non-foil cards
            const imgData = ctx.getImageData(0, 0, debugCanvas.width, debugCanvas.height);
            const data = imgData.data;
            let dataCopy = new Uint8ClampedArray(data); // Save original for Pass 2
            
            for (let i = 0; i < data.length; i += 4) {
                let brightness = (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114);
                brightness = brightness < 120 ? brightness * 0.7 : brightness * 1.3;
                if(brightness > 255) brightness = 255;
                data[i] = data[i+1] = data[i+2] = brightness;
            }
            ctx.putImageData(imgData, 0, 0);

            let result = await worker.recognize(debugCanvas);
            let cleanText = result.data.text.replace(/[^a-zA-ZÄÖÜäöüß0-9\s\-,!'&]/g, '').trim();
            
            // PASS 2: If nothing found, apply Hard Binarization (Otsu-Style) for Shiny/Foil Cards
            if (cleanText.length < 3) {
                for (let i = 0; i < dataCopy.length; i += 4) {
                    let b = (dataCopy[i] * 0.299 + dataCopy[i+1] * 0.587 + dataCopy[i+2] * 0.114);
                    let val = b < 100 ? 0 : 255; // Extreme black & white
                    dataCopy[i] = dataCopy[i+1] = dataCopy[i+2] = val;
                }
                const hardImgData = new ImageData(dataCopy, debugCanvas.width, debugCanvas.height);
                ctx.putImageData(hardImgData, 0, 0);
                
                result = await worker.recognize(debugCanvas);
                cleanText = result.data.text.replace(/[^a-zA-ZÄÖÜäöüß0-9\s\-,!'&]/g, '').trim();
            }

            if (cleanText.length > 2) {
                cardList.push(cleanText);
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('card-counter').innerText = cardList.length;
            const uiList = document.getElementById('card-list-ui');
            const counts = {};
            cardList.forEach(c => counts[c] = (counts[c] || 0) + 1);
            
            uiList.innerHTML = '';
            for (const [name, qty] of Object.entries(counts)) {
                uiList.innerHTML += `<li class="card-item"><span class="card-qty">${qty}x</span> ${name}</li>`;
            }
            uiList.scrollTop = uiList.scrollHeight;
        }

        function clearList() {
            if(confirm('Liste wirklich leeren?')) {
                cardList = [];
                updateUI();
            }
        }

        function showLoading(text) {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-overlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function getAggregatedList() {
            const counts = {};
            cardList.forEach(c => counts[c] = (counts[c] || 0) + 1);
            return Object.entries(counts).map(([name, qty]) => `${qty}x ${name}`).join('\n');
        }

        function exportGemini() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            const prompt = "Bitte analysiere diese Yu-Gi-Oh! Deckliste und gib mir detaillierte Empfehlungen für Synergien, Combos und mögliche Verbesserungen:\n\n" + getAggregatedList();
            navigator.clipboard.writeText(prompt).then(() => alert("Gemini Prompt in die Zwischenablage kopiert!"));
        }

        function exportTXT() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            const blob = new Blob([getAggregatedList()], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'YGO_Deckliste.txt';
            a.click();
        }

        function exportNeuron() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            let out = "#created by YGO Instant Scanner\n#main\n";
            cardList.forEach(c => out += c + "\n");
            out += "#extra\n!side\n";
            const blob = new Blob([out], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Neuron_Deck.txt';
            a.click();
        }

        async function exportYDK() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            showLoading("Gleiche mit YGOPRODeck API ab...");
            
            const counts = {};
            cardList.forEach(c => counts[c] = (counts[c] || 0) + 1);
            
            let mainDeckIds = [];
            let extraDeckIds = [];
            let notFound = [];

            for (const [name, qty] of Object.entries(counts)) {
                try {
                    // 1. Check English Database Name First
                    let res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?name=${encodeURIComponent(name)}`);
                    
                    // 2. Fallback: If not found, check the German Database
                    if (!res.ok) {
                        res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?language=de&name=${encodeURIComponent(name)}`);
                    }
                    
                    if (res.ok) {
                        const data = await res.json();
                        const card = data.data[0];
                        const type = card.type.toLowerCase();
                        const id = card.id;
                        
                        const isExtra = type.includes('fusion') || type.includes('synchro') || type.includes('xyz') || type.includes('link');
                        
                        for(let i=0; i<qty; i++) {
                            if(isExtra) extraDeckIds.push(id);
                            else mainDeckIds.push(id);
                        }
                    } else {
                        notFound.push(name);
                    }
                } catch(e) {
                    notFound.push(name);
                }
            }

            hideLoading();
            
            if (notFound.length > 0) {
                alert("Folgende Karten wurden in der DB nicht gefunden (Tippfehler?):\n" + notFound.join(", "));
            }

            let ydkString = "#created by YGO Instant Scanner\n#main\n";
            mainDeckIds.forEach(id => ydkString += id + "\n");
            ydkString += "#extra\n";
            extraDeckIds.forEach(id => ydkString += id + "\n");
            ydkString += "!side\n";

            const blob = new Blob([ydkString], { type: 'text/ydk' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Deck.ydk';
            a.click();
        }
    </script>
</body>
</html>
