<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YGO Instant Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --primary: #FFB703;
            --bg-dark: #0f111a;
            --bg-panel: #1a1d29;
            --neon-cyan: #00f3ff;
            --text-light: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header { background: var(--bg-panel); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 1px solid #2d3748; flex-shrink: 0; }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #FFB703, #FF8C00); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #000; font-size: 16px; }
        .title-group h1 { font-size: 15px; font-weight: 700; color: var(--primary); }
        .title-group p { font-size: 10px; color: #a0aec0; }
        
        .status-container { display: flex; gap: 6px; }
        .status-pill { display: flex; align-items: center; gap: 5px; background: #1e293b; color: #94a3b8; padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; border: 1px solid #334155; }
        .status-pill.ready { background: #064e3b; color: #34d399; border-color: #047857; }
        .dot { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; }
        .status-pill.ready .dot { background: #34d399; }

        /* SCANNER VIEWPORT */
        .scanner-container { 
            position: relative; 
            flex: 1.1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            background: #000; 
        }

        #camera-feed { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .tunnel-mask {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 58%; 
            height: 36px; 
            max-width: 230px;
            box-shadow: 0 0 0 9999px rgba(5, 5, 8, 0.98);
            border: 2px solid var(--neon-cyan);
            border-radius: 4px;
            z-index: 2;
            pointer-events: none;
        }

        .tunnel-label { 
            position: absolute; 
            top: -26px; 
            left: 50%; 
            transform: translateX(-50%);
            white-space: nowrap; 
            text-align: center; 
            color: #fff; 
            font-size: 10px; 
            font-weight: bold; 
            background: rgba(0,0,0,0.85); 
            padding: 2px 8px; 
            border-radius: 4px; 
        }
        
        .laser-line { 
            width: 100%; 
            height: 2px; 
            background: var(--primary); 
            position: absolute; 
            top: 50%; 
            box-shadow: 0 0 8px var(--primary); 
            animation: scan 2s ease-in-out infinite; 
            opacity: 0.8; 
        }

        .tools-overlay { 
            position: absolute; 
            bottom: 8px; 
            right: 8px; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            gap: 6px; 
            z-index: 10; 
        }
        .tool-btn { 
            background: rgba(20, 24, 35, 0.85); 
            border: 1px solid rgba(255,255,255,0.25); 
            color: white; 
            border-radius: 6px; 
            padding: 4px 8px; 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
        }
        #torch-btn { width: 34px; height: 34px; border-radius: 50%; font-size: 14px; display: none; }
        .preview-canvas-container { 
            border: 1px solid #00f3ff; 
            border-radius: 4px; 
            overflow: hidden; 
            background: #000; 
        }
        #debug-canvas { max-width: 110px; height: auto; display: block; }

        /* CONTROLS */
        .controls-panel { padding: 10px 14px; background: var(--bg-dark); z-index: 10; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .main-action-row { display: flex; gap: 10px; }
        
        #scan-btn {
            flex: 1;
            background: linear-gradient(180deg, #FFC933 0%, #FFB703 100%);
            color: #000; border: none; border-radius: 10px;
            padding: 14px; font-size: 16px; font-weight: 800;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(255, 183, 3, 0.3);
            cursor: pointer;
        }
        #scan-btn:active { transform: scale(0.97); }
        
        .counter-box { background: var(--bg-panel); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 70px; border: 1px solid #2d3748; }
        .counter-box span { font-size: 9px; color: #a0aec0; text-transform: uppercase; font-weight: bold; }
        .counter-box strong { font-size: 18px; color: var(--primary); }

        /* LIST AREA */
        .list-container { flex: 1; background: var(--bg-panel); margin: 0 14px; border-radius: 10px 10px 0 0; border: 1px solid #2d3748; border-bottom: none; display: flex; flex-direction: column; overflow: hidden; }
        .list-header { padding: 8px 12px; background: rgba(0,0,0,0.2); border-bottom: 1px solid #2d3748; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .clear-btn { color: #f87171; background: none; border: none; font-size: 11px; cursor: pointer; }
        
        #card-list-ui { flex: 1; overflow-y: auto; padding: 8px; list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .card-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
        .card-left { display: flex; align-items: center; gap: 8px; overflow: hidden; }
        .card-name-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-qty { background: rgba(255,183,3,0.2); color: var(--primary); padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; flex-shrink: 0; }
        .delete-item-btn { color: #718096; background: none; border: none; font-size: 14px; padding: 0 4px; cursor: pointer; }

        /* EXPORT ROW */
        .export-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px 14px 12px 14px; background: var(--bg-panel); border-top: 1px solid #2d3748; flex-shrink: 0; }
        .export-btn { background: #2d3748; color: #fff; border: none; padding: 9px; border-radius: 6px; font-size: 12px; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 4px; cursor: pointer; }
        .export-btn.gemini { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .export-btn.ydk { background: #059669; }

        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; flex-direction: column; color: white; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid var(--primary); border-radius: 50%; width: 34px; height: 34px; animation: spin 1s linear infinite; margin-bottom: 8px; }

        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">📷</div>
            <div class="title-group">
                <h1>YGO INSTANT SCANNER</h1>
                <p>Zero-Popup Deckliste</p>
            </div>
        </div>
        <div class="status-container">
            <div class="status-pill" id="db-status"><div class="dot"></div> DB</div>
            <div class="status-pill" id="ocr-status"><div class="dot"></div> OCR</div>
        </div>
    </header>

    <div class="scanner-container" id="scanner-box">
        <video id="camera-feed" autoplay playsinline muted></video>
        <div class="tunnel-mask" id="tunnel-hole">
            <div class="tunnel-label">KARTENNAME HIER</div>
            <div class="laser-line"></div>
        </div>
        
        <div class="tools-overlay">
            <button class="tool-btn" id="torch-btn" onclick="toggleTorch()">🔦</button>
            <div class="preview-canvas-container" title="Exakte OCR-Aufnahme">
                <canvas id="debug-canvas"></canvas>
            </div>
        </div>
    </div>

    <div class="list-container">
        <div class="list-header">
            <span>📋 Live-Liste (ohne Bestätigung)</span>
            <button class="clear-btn" onclick="clearList()">Liste leeren</button>
        </div>
        <ul id="card-list-ui"></ul>
    </div>

    <div class="controls-panel">
        <div class="main-action-row">
            <button id="scan-btn" onclick="captureAndScan()" disabled>
                ◉ ABDRUCK SCANNEN
            </button>
            <div class="counter-box">
                <span>Karten</span>
                <strong id="card-counter">0</strong>
            </div>
        </div>
        
        <div class="export-row">
            <button class="export-btn gemini" onclick="exportGemini()">✨ Gemini Prompt</button>
            <button class="export-btn ydk" onclick="exportYDK()">🔻 YGOPro .YDK</button>
            <button class="export-btn" onclick="exportNeuron()">📄 Neuron List</button>
            <button class="export-btn" onclick="exportTXT()">💾 .TXT</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Gleiche Datenbank ab...</div>
    </div>

    <script>
        let video = document.getElementById('camera-feed');
        let tunnelHole = document.getElementById('tunnel-hole');
        let debugCanvas = document.getElementById('debug-canvas');
        let torchBtn = document.getElementById('torch-btn');
        let scannerBox = document.getElementById('scanner-box');
        
        let worker = null;
        let cardList = [];
        let videoTrack = null;
        let torchEnabled = false;

        // In-Memory Card Database für Instant-Fuzzy-Matching
        let dbCards = []; // Array von { cleanName: "kashtira fenrir", realName: "Kashtira Fenrir", id: 12345, isExtra: false }

        const renderCanvas = document.createElement('canvas');
        const renderCtx = renderCanvas.getContext('2d', { willReadFrequently: true });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(success = true) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const f = success ? 900 : 300;
            osc.frequency.setValueAtTime(f, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(f + (success ? 300 : -100), audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
            if (navigator.vibrate) navigator.vibrate(success ? 40 : [30, 50, 30]);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment', 
                        focusMode: 'continuous',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                const cap = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if (cap.torch) torchBtn.style.display = 'flex';
            } catch (err) {
                alert("Kamera-Zugriff nicht möglich: " + err.message);
            }
        }

        function toggleTorch() {
            if (!videoTrack) return;
            torchEnabled = !torchEnabled;
            videoTrack.applyConstraints({ advanced: [{ torch: torchEnabled }] });
            torchBtn.style.background = torchEnabled ? 'rgba(255, 183, 3, 0.4)' : 'rgba(20, 24, 35, 0.85)';
        }

        // LÄDT ALLE KARTENNAMEN (Lokal gecacht via IndexedDB / LocalStorage)
        async function loadCardDatabase() {
            const dbStatus = document.getElementById('db-status');
            try {
                // Schneller Abruf des schlanken YGO-Card-Index (nur Name, ID und Type)
                const cache = localStorage.getItem('ygo_card_db_v1');
                if (cache) {
                    dbCards = JSON.parse(cache);
                    dbStatus.classList.add('ready');
                    return;
                }

                const res = await fetch('https://db.ygoprodeck.com/api/v7/cardinfo.php');
                const data = await res.json();
                if (data && data.data) {
                    dbCards = data.data.map(c => {
                        const t = c.type.toLowerCase();
                        return {
                            cleanName: c.name.toLowerCase().replace(/[^a-z0-9]/g, ''),
                            realName: c.name,
                            id: c.id,
                            isExtra: t.includes('fusion') || t.includes('synchro') || t.includes('xyz') || t.includes('link')
                        };
                    });
                    // In LocalStorage sichern für Instant-Start nächstes Mal
                    try { localStorage.setItem('ygo_card_db_v1', JSON.stringify(dbCards)); } catch(e){}
                    dbStatus.classList.add('ready');
                }
            } catch (e) {
                console.warn("DB Offline/Ladefehler:", e);
                dbStatus.innerText = "DB Offline";
            }
        }

        async function initOCR() {
            try {
                worker = await Tesseract.createWorker(['deu', 'eng']);
                await worker.setParameters({
                    tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE,
                    tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß0123456789 -,'"
                });
                const ocrStatus = document.getElementById('ocr-status');
                ocrStatus.classList.add('ready');
                document.getElementById('scan-btn').disabled = false;
            } catch (e) {
                document.getElementById('ocr-status').innerText = 'OCR Error';
            }
        }

        startCamera();
        loadCardDatabase();
        initOCR();

        // 1-Klick-Erkennung mit Instant-Fuzzy-Matcher
        async function captureAndScan() {
            if (!worker || video.videoWidth === 0) return;

            const cW = scannerBox.clientWidth;
            const cH = scannerBox.clientHeight;
            const vW = video.videoWidth;
            const vH = video.videoHeight;

            const scale = Math.max(cW / vW, cH / vH);
            const rW = vW * scale;
            const rH = vH * scale;
            const rX = (cW - rW) / 2;
            const rY = (cH - rH) / 2;

            renderCanvas.width = cW;
            renderCanvas.height = cH;
            renderCtx.drawImage(video, rX, rY, rW, rH);

            const boxRect = tunnelHole.getBoundingClientRect();
            const contRect = scannerBox.getBoundingClientRect();

            const cropX = boxRect.left - contRect.left;
            const cropY = boxRect.top - contRect.top;
            const cropW = boxRect.width;
            const cropH = boxRect.height;

            debugCanvas.width = cropW * 2;
            debugCanvas.height = cropH * 2;
            const dCtx = debugCanvas.getContext('2d');
            dCtx.imageSmoothingEnabled = true;
            dCtx.imageSmoothingQuality = 'high';
            dCtx.drawImage(renderCanvas, cropX, cropY, cropW, cropH, 0, 0, debugCanvas.width, debugCanvas.height);

            const result = await worker.recognize(debugCanvas);
            const rawText = result.data.text.trim();

            if (rawText.length < 3) {
                playBeep(false);
                return;
            }

            // Sofortige Fuzzy-Korrektur gegen die Datenbank
            const matchedName = matchAgainstDatabase(rawText);

            if (matchedName) {
                playBeep(true);
                cardList.push(matchedName);
                updateUI();
            } else {
                // Fallback: Wenn Karte neu ist oder DB nicht geladen, nimm gereinigten Text
                const fallback = cleanRaw(rawText);
                if (fallback.length >= 4) {
                    playBeep(true);
                    cardList.push(fallback);
                    updateUI();
                } else {
                    playBeep(false); // Unsinniger Scan (ur wo etc.) lautlos/mit Fehlerton verworfen!
                }
            }
        }

        // LEVENSHTEIN / N-GRAM INSTANT FUZZY MATCHER (< 5 ms)
        function matchAgainstDatabase(rawInput) {
            if (!dbCards || dbCards.length === 0) return null;

            const query = rawInput.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (query.length < 3) return null;

            let bestMatch = null;
            let highestSimilarity = 0;

            for (let i = 0; i < dbCards.length; i++) {
                const c = dbCards[i];
                // 1. Direkter Substring-Treffer
                if (c.cleanName === query) {
                    return c.realName;
                }
                
                // 2. Ähnlichkeitsberechnung
                const sim = similarity(query, c.cleanName);
                if (sim > highestSimilarity) {
                    highestSimilarity = sim;
                    bestMatch = c.realName;
                }
            }

            // Wenn die Übereinstimmung mindestens 62% ist (z. B. "kashtirafenrir8" vs "kashtirafenrir" = 93%)
            if (highestSimilarity >= 0.62) {
                return bestMatch;
            }

            return null;
        }

        // Schneller Ähnlichkeits-Score (Dice-Koeffizient auf Bigrammen)
        function similarity(s1, s2) {
            if (s1 === s2) return 1;
            if (s1.length < 2 || s2.length < 2) return 0;

            const bigrams = new Map();
            for (let i = 0; i < s1.length - 1; i++) {
                const b = s1.substr(i, 2);
                bigrams.set(b, (bigrams.get(b) || 0) + 1);
            }

            let intersection = 0;
            for (let i = 0; i < s2.length - 1; i++) {
                const b = s2.substr(i, 2);
                const count = bigrams.get(b) || 0;
                if (count > 0) {
                    bigrams.set(b, count - 1);
                    intersection++;
                }
            }

            return (2.0 * intersection) / (s1.length + s2.length - 2);
        }

        function cleanRaw(raw) {
            return raw
                .replace(/^[0-9\s\-,']+/g, '') 
                .replace(/[^a-zA-ZÄÖÜäöüß0-9\s\-,']/g, '') 
                .replace(/\s+(a|x|bf|ii|57|e|i|h|o|u|m)$/i, '') 
                .replace(/^[\s\-,']+|[\s\-,']+$/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }

        function updateUI() {
            document.getElementById('card-counter').innerText = cardList.length;
            const uiList = document.getElementById('card-list-ui');
            const counts = {};
            cardList.forEach(c => counts[c] = (counts[c] || 0) + 1);
            
            uiList.innerHTML = '';
            for (const [name, qty] of Object.entries(counts)) {
                uiList.innerHTML += `
                    <li class="card-item">
                        <div class="card-left">
                            <span class="card-qty">${qty}x</span>
                            <span class="card-name-txt">${name}</span>
                        </div>
                        <button class="delete-item-btn" onclick="removeSingleCard('${name.replace(/'/g, "\\'")}')">✕</button>
                    </li>`;
            }
            uiList.scrollTop = uiList.scrollHeight;
        }

        function removeSingleCard(cardName) {
            const idx = cardList.lastIndexOf(cardName);
            if (idx !== -1) {
                cardList.splice(idx, 1);
                updateUI();
            }
        }

        function clearList() {
            if(confirm('Liste wirklich leeren?')) {
                cardList = [];
                updateUI();
            }
        }

        function showLoading(text) {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-overlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function getAggregatedList() {
            const counts = {};
            cardList.forEach(c => counts[c] = (counts[c] || 0) + 1);
            return Object.entries(counts).map(([name, qty]) => `${qty}x ${name}`).join('\n');
        }

        function exportGemini() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            const prompt = "Bitte analysiere diese Yu-Gi-Oh! Deckliste und gib mir Empfehlungen für Synergien und passende Ergänzungen:\n\n" + getAggregatedList();
            navigator.clipboard.writeText(prompt).then(() => alert("Gemini Prompt in Zwischenablage kopiert!"));
        }

        function exportTXT() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            const blob = new Blob([getAggregatedList()], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'YGO_Deckliste.txt';
            a.click();
        }

        function exportNeuron() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            let out = "#created by YGO Instant Scanner\n#main\n";
            cardList.forEach(c => out += c + "\n");
            out += "#extra\n!side\n";
            const blob = new Blob([out], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Neuron_Deck.txt';
            a.click();
        }

        // Instant .YDK Export ohne Ladezeiten (da IDs bereits in lokaler DB liegen!)
        async function exportYDK() {
            if(cardList.length === 0) return alert("Liste ist leer!");
            showLoading("Erstelle .YDK...");
            
            const counts = {};
            cardList.forEach(c => counts[c] = (counts[c] || 0) + 1);
            
            let mainDeckIds = [];
            let extraDeckIds = [];
            let notFound = [];

            for (const [name, qty] of Object.entries(counts)) {
                // Suche zuerst in geladener DB
                const clean = name.toLowerCase().replace(/[^a-z0-9]/g, '');
                const found = dbCards.find(c => c.cleanName === clean || c.realName.toLowerCase() === name.toLowerCase());

                if (found) {
                    for(let i=0; i<qty; i++) {
                        if(found.isExtra) extraDeckIds.push(found.id);
                        else mainDeckIds.push(found.id);
                    }
                } else {
                    // Fallback Online Check
                    try {
                        let res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?name=${encodeURIComponent(name)}`);
                        if (!res.ok) res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?language=de&name=${encodeURIComponent(name)}`);
                        if (res.ok) {
                            const data = await res.json();
                            const card = data.data[0];
                            const t = card.type.toLowerCase();
                            const isEx = t.includes('fusion') || t.includes('synchro') || t.includes('xyz') || t.includes('link');
                            for(let i=0; i<qty; i++) {
                                if(isEx) extraDeckIds.push(card.id);
                                else mainDeckIds.push(card.id);
                            }
                        } else {
                            notFound.push(name);
                        }
                    } catch(e) {
                        notFound.push(name);
                    }
                }
            }

            hideLoading();
            if (notFound.length > 0) {
                alert("Konnte Passcode nicht finden für:\n" + notFound.join(", "));
            }

            let ydk = "#created by YGO Instant Scanner\n#main\n";
            mainDeckIds.forEach(id => ydk += id + "\n");
            ydk += "#extra\n";
            extraDeckIds.forEach(id => ydk += id + "\n");
            ydk += "!side\n";

            const blob = new Blob([ydk], { type: 'text/ydk' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Deck.ydk';
            a.click();
        }
    </script>
</body>
</html>
